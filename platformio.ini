; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags 
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html



; Ohne diese Angabe würde `pio run` auch die Testumgebung `native` bauen und
; dort mangels main() am Linker scheitern. Die Hosttests laufen ausschließlich
; über `pio test -e native`.
[platformio]
default_envs = lolin_s3_mini

; Hostumgebung für Tests der hardwarefreien Auswertelogik.
;
; Sie übersetzt ausschließlich curve_detector.cpp und läuft auf dem
; Entwicklungsrechner. Dadurch kostet dieser Test kein Byte Firmware-Flash -
; ein wesentlicher Punkt, weil der Messbuild bei 95,5 Prozent Flash steht und
; die On-Device-Testsuite allein 55,6 kByte davon belegt.
;
;   pio test -e native
;
[env:native]
platform = native
test_framework = unity
; Ohne test_build_src uebersetzt PlatformIO src/ im Testlauf nicht mit.
test_build_src = yes
build_src_filter = +<curve_detector.cpp> +<road_metrics.cpp>
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I src

[env:lolin_s3_mini]
platform = espressif32
board = lolin_s3_mini
framework = arduino
extra_scripts =
    pre:scripts/version_firmware.py
    pre:scripts/patch_bno055_reset_timeout.py

; Upload settings for ESP32-S3 with USB-CDC
; Platzhalter statt fester Nummer: Die native USB-CDC-Schnittstelle bekommt
; von macOS je nach Hub und Buchse eine andere Nummer (usbmodem101,
; usbmodem2101, ...). Der Platzhalter trifft sie alle und schliesst die
; Bluetooth- und Debug-Ports aus.
upload_port = /dev/cu.usbmodem*
upload_speed = 115200
upload_protocol = esptool
upload_flags = 
    --chip=esp32s3
    --before=default_reset
    --after=hard_reset
    --connect-attempts=10

; Serial Monitor
monitor_speed = 115200
monitor_port = /dev/cu.usbmodem*

; Build flags
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DLOG_LOCAL_LEVEL=ESP_LOG_NONE

; Alle Quelldateien kompilieren (Standard)
; build_src_filter = +<*>

; Libraries  
lib_deps = 
    adafruit/Adafruit BNO055@^1.6.3
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit GFX Library@^1.11.9  
    adafruit/Adafruit SSD1306@^2.5.9
    mikalhart/TinyGPSPlus@^1.0.3
    Wire
    SPI

; Keine extra library dirs mehr nötig

debug_tool = esp-builtin
